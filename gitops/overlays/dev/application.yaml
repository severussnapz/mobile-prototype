apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genesis-ai-requirements-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: genesis-ai-requirements-api  # Must match the AppProject name in genesis

  sources:
    - repoURL: centraluk.jfrog.io
      chart: genesis-helm-rel-loc/emisx-service
      targetRevision: 1.1.0       # Pin to a specific chart version — never `latest`
      helm:
        valueFiles:
          - $values/gitops/base/values.yaml           # Shared base values
          - $values/gitops/overlays/dev/values.yaml   # Dev-specific overrides

    - repoURL: https://github.com/emisgroup/genesis-ai-requirements-api
      targetRevision: main
      ref: values

    # Raw manifests — the KRO ApplicationStack (provisions this service's AWS
    # resources). DB access uses RDS IAM auth, so there is no ExternalSecret.
    # Per-env manifest — dev can differ from int/stg.
    - repoURL: https://github.com/emisgroup/genesis-ai-requirements-api
      targetRevision: main
      path: gitops/overlays/dev/manifests

  destination:
    namespace: genesis-ai-requirements-api-ns
    name: genesis-a

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
