# Dev environment overrides for the emisx-service chart.
replicaCount: 1

image:
  repository: 442042551704.dkr.ecr.eu-west-2.amazonaws.com/genesis-ai-requirements-api
  pullPolicy: Always
  # dev images are pushed as `:latest` by .github/workflows/build.yml. Pinned
  # release tags are used for int/stg/prd once those environments onboard.
  tag: latest

flyway:
  enabled: true
  image:
    repository: 442042551704.dkr.ecr.eu-west-2.amazonaws.com/genesis-ai-requirements-api-flyway
    tag: latest
    pullPolicy: Always
  args: ["migrate"]
  env:
    # Aurora writer endpoint (ApplicationStack status `rdsClusterEndpoint`).
    # TODO: set once the stack provisions.
    - name: FLYWAY_URL
      value: "jdbc:postgresql://genesis-ai-requirements-api-rds-dbc-aurora.cluster-ch0ckkyo8j17.eu-west-2.rds.amazonaws.com:5432/genesis_ai_requirements"
    - name: FLYWAY_USER
      valueFrom:
        secretKeyRef:
          name: rds-credentials
          key: username
    - name: FLYWAY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: rds-credentials
          key: password
    # Aurora can briefly refuse connections immediately after provisioning/sync.
    - name: FLYWAY_CONNECT_RETRIES
      value: "60"

# Full application environment for dev.
#
# Declared in one place because Argo/Helm REPLACE list values across valueFiles
# (no array merge). The API reaches RDS, S3 and Bedrock through the Pod Identity
# role from the ApplicationStack — no DB password / ExternalSecret is involved.
#
# RDS uses IAM database authentication: when RDS_HOST is set the API builds a
# passwordless connection string and signs short-lived IAM tokens
# (DependencyInjection.AddPersistence). The pod-identity role needs the
# `rds-db:connect` action for db user `genesis_ai_app` (provisioned by the KRO
# RDS composite on branch feat/kro-rds-definition).
env:
  - name: "HTTP_PROXY"
    value: "185.46.212.92:443"
  - name: "HTTPS_PROXY"
    value: "185.46.212.92:443"
  - name: "NO_PROXY"
    value: "100.69.64.0/18,10.100.0.0/16,2a05:d01c:494:6200::/56,fd00:5299:d428::/108,fd00:ec2::254,fd00:ec2::23,localhost,127.0.0.1,169.254.169.254,169.254.170.23,.svc,.svc.cluster.local,.cluster.local"
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: HOSTING_ENVIRONMENT
    value: AWS
  # Dynatrace release metadata — enriches Serilog logs (DynatraceTextFormatter)
  # and OneAgent release tracking. HOSTING_ENVIRONMENT=AWS above activates the
  # Dynatrace-format structured logging (Core/Logging/LoggingConfigurationExtensions).
  - name: DT_RELEASE_STAGE
    value: dev
  - name: DT_RELEASE_PRODUCT
    value: genesis-ai-requirements-api
  - name: DT_RELEASE_VERSION
    value: latest
  - name: AWS_REGION
    value: eu-west-2
  # Swagger/OpenAPI explorer. The app only serves Swagger in Development or when
  # this flag is set — enable it here so the dev cluster (which runs as
  # Production) still exposes /swagger.
  - name: Swagger__Enabled
    value: "true"
  # S3 artefact storage — bucket provisioned by the ApplicationStack.
  # TODO: confirm the exact bucket name the composite derives from `instance`.
  - name: S3__ArtefactBucketName
    value: genesis-ai-requirements-api
  # Bedrock — region + model the BedrockAiService targets.
  - name: Bedrock__Region
    value: eu-west-2
  - name: Bedrock__ModelId
    value: anthropic.claude-sonnet-4-6
  # RDS (IAM auth). RDS_USER / RDS_DB_NAME mirror the ApplicationStack rds block.
  # RDS_HOST is the Aurora cluster writer endpoint (rdsClusterEndpoint status
  # output) — TODO: set once feat/kro-rds-definition is merged and the stack runs.
  - name: RDS_HOST
    value: "genesis-ai-requirements-api-rds-dbc-aurora.cluster-ch0ckkyo8j17.eu-west-2.rds.amazonaws.com"
  - name: RDS_PORT
    value: "5432"
  - name: RDS_DB_NAME
    value: genesis_ai_requirements
  # RDS IAM database authentication: passwordless. The app builds the connection
  # string from RDS_USER + RDS_HOST and signs short-lived IAM tokens; it never
  # reads a password. `genesis_ai_app` is a least-privilege role created by
  # migration V26 (granted `rds_iam`); the pod-identity role's `rds-db:connect`
  # policy is provisioned by the KRO RDS composite (iamDbUsername).
  - name: RDS_USER
    value: genesis_ai_app

  # Dev OIDC settings for JWT bearer auth.
  # TODO: confirm the dev identity Authority + Audience values.
  - name: Authentication__Authority
    value: https://identity.dev.emishealthsolutions.com/5eb0f67d-cfc5-418b-aad3-0c194267c1f2/v2.0/
  - name: Authentication__Audience
    value: 8a9616a7-f3ba-4626-8659-84d9cf272e0c

  # CORS allowed origins for the frontend. Without these the app falls back to
  # the localhost default and rejects the deployed frontend. The app applies the
  # "AllowFrontend" policy (WithOrigins + AllowCredentials). Mirrors the origins
  # configured for ai-scribe-eval-api in dev.
  - name: Cors__AllowedOrigins__0
    value: http://localhost:8080
  - name: Cors__AllowedOrigins__1
    value: http://localhost:8081
  - name: Cors__AllowedOrigins__2
    value: https://host.sbx.emishealthsolutions.com
  - name: Cors__AllowedOrigins__3
    value: https://app.dev.emishealthsolutions.com

# --- Database migrations (EKS golden path) ----------------------------------
# Flyway runs as an initContainer (chart `flyway:` block) in the API pod, before
# the app container starts, applying db/migrations against the Aurora cluster.
# This is the EKS replacement for the legacy ECS migration task — no ECS task
# definition, no db-migrations-* security group, no genesis run-flyway workflow.
#
# The migration image is built/pushed by .github/workflows/build-flyway.yml to
# the dedicated `genesis-ai-requirements-api-flyway` repo as `:latest`
# (db/migrations baked in).
#
# Credentials: the initial schema — including V13, which grants `rds_iam` to
# genesis_ai_app — must run as the Aurora MASTER user, because IAM database auth
# is not usable until V13 has been applied. genesis_ai_app is the cluster master
# username with an RDS-managed password in Secrets Manager. The top-level
# `secretProviderClass` below syncs that secret into a `rds-credentials` K8s
# Secret (the CSI volume mount on the pod drives the sync before the initContainer
# runs); the flyway initContainer reads username/password from it via secretKeyRef.
# The running API itself uses RDS IAM auth (RDS_HOST above) and never reads this
# secret.

# CSI mount that drives the Secrets Store driver to sync the RDS master secret
# into the `rds-credentials` K8s Secret (see secretProviderClass below). The
# mount on the pod is what triggers the sync before the flyway initContainer runs.
volumeMounts:
  - name: secrets-store-inline
    mountPath: /mnt/secrets-store
    readOnly: true
volumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: app-csi-store

# Syncs the RDS-managed master secret into a `rds-credentials` K8s Secret that
# the flyway initContainer reads via secretKeyRef.
secretProviderClass:
  enabled: true
  region: eu-west-2
  name: app-csi-store
  objects:
    # ARN of the RDS-managed master secret (ApplicationStack status
    # `masterUserSecret`). TODO: set once the stack provisions.
    - objectName: "arn:aws:secretsmanager:eu-west-2:442042551704:secret:rds!cluster-9df31198-19ce-421d-99f1-af2638266a33-uMMeko"
      objectType: secretsmanager
      jmesPath:
        - path: username
          objectAlias: rds-username
        - path: password
          objectAlias: rds-password
  secretObjects:
    - secretName: rds-credentials
      type: Opaque
      data:
        - objectName: rds-username
          key: username
        - objectName: rds-password
          key: password

SecurityGroupPolicy:
  enabled: true
  matchLabels:
    app.kubernetes.io/name: genesis-ai-requirements-api
  groupIds:
    - sg-02895b4fefca7778f