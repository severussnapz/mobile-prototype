# Per-env KRO ApplicationStack for INT. Each env keeps its own copy under
# gitops/overlays/<env>/manifests so it can evolve independently. Currently mirrors
# the dev variant (Serverless v2 min sizing, deletionProtection off for easy teardown).
apiVersion: kro.run/v1alpha1
kind: ApplicationStack
metadata:
  name: genesis-ai-requirements-api
  namespace: genesis-ai-requirements-api-ns
  labels:
    app.kubernetes.io/part-of: genesis
    app.kubernetes.io/component: application-stack
spec:
  instance: genesis-ai-requirements-api
  repositoryName: genesis-ai-requirements-api
  description: "Genesis AI Requirements API (int)"
  githubOIDC: "repo:emisgroup/genesis-ai-requirements-api:*"

  ecr:
    enabled: true
    enableFlywayECRRepo: true

  s3:
    enabled: true
    instance: ""
    enableVersioning: true

  rds:
    enabled: true
    databaseName: genesis_ai_requirements
    username: dbadmin
    iamDbUsername: genesis_ai_app
    databaseSubnetGroupName: genesis-net-vpc
    ingressSecurityGroupIds: []
    engineVersion: "17.7"
    family: aurora-postgresql17
    instanceType: "db.serverless"
    serverlessV2ScalingConfiguration:
      minCapacity: "0.5"
      maxCapacity: "8"
    deletionProtection: false
    backupRetentionPeriod: 7
    enableDataApi: false
    insightsEnabled: false
    insightsRetentionPeriod: 7
    monitoringInterval: 0
    monitoringRoleArn: ""
    enableReader: false
    enableProxy: false
    proxyIngressSecurityGroupIds: []
    proxySubnetIds: []
    proxyDebugLogging: false
    proxyIdleClientTimeout: 300
    proxyRequireTls: true
    proxyIamAuth: "REQUIRED"

  bedrock:
    enabled: true
    modelId: anthropic.claude-sonnet-4-6

  tags:
    application: emisx-genesis-ai-requirements-api
    service: genesis-ai-requirements-api
    repo: "emisgroup/genesis-ai-requirements-api"
