apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genesis-ai-requirements-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: genesis-ai-requirements-api  # Must match the AppProject name in genesis

  sources:
    - repoURL: centraluk.jfrog.io
      chart: genesis-helm-rel-loc/emisx-service
      targetRevision: 1.1.0       # Pin to a specific chart version — never `latest`
      helm:
        valueFiles:
          - $values/gitops/base/values.yaml            # Shared base values
          - $values/gitops/overlays/int/values.yaml    # Int-specific overrides

    # Unlike dev (which tracks `main`), int pins to the release tag so config,
    # manifests and image move together. release-please rewrites the version.
    - repoURL: https://github.com/emisgroup/genesis-ai-requirements-api
      targetRevision: v0.0.0 # x-release-please-version
      ref: values

    # Per-env KRO ApplicationStack — int can differ from dev/stg.
    - repoURL: https://github.com/emisgroup/genesis-ai-requirements-api
      targetRevision: v0.0.0 # x-release-please-version
      path: gitops/overlays/int/manifests

  destination:
    namespace: genesis-ai-requirements-api-ns
    name: genesis-a

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
