apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genesis-ai-requirements-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: genesis-ai-requirements-api  # Must match the AppProject name in genesis

  sources:
    - repoURL: centraluk.jfrog.io
      chart: genesis-helm-rel-loc/emisx-service
      targetRevision: 1.1.0       # Pin to a specific chart version — never `latest`
      helm:
        valueFiles:
          - $values/gitops/base/values.yaml            # Shared base values
          - $values/gitops/overlays/stg/values.yaml    # Stg-specific overrides

    # stg pins to the release tag; deploy is gated by the `staging` GitHub
    # Environment approval in gitops-deploy-int-stg.yaml.
    - repoURL: https://github.com/emisgroup/genesis-ai-requirements-api
      targetRevision: v0.0.0 # x-release-please-version
      ref: values

    # Per-env KRO ApplicationStack — stg can differ from dev/int
    # (e.g. deletionProtection: true, larger RDS scaling).
    - repoURL: https://github.com/emisgroup/genesis-ai-requirements-api
      targetRevision: v0.0.0 # x-release-please-version
      path: gitops/overlays/stg/manifests

  destination:
    namespace: genesis-ai-requirements-api-ns
    name: genesis-a

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
