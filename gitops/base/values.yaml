# Shared Helm values for the emisx-service chart (centraluk.jfrog.io/genesis-helm-rel-loc/emisx-service).
# Environment overlays (gitops/overlays/<env>/values.yaml) layer image tag,
# replica count and environment-specific config on top of these.
#
# NOTE: validate these keys against the pinned chart version (1.1.0) — the chart
# is the source of truth for supported value structure.
nameOverride: genesis-ai-requirements-api
namespaceOverride: genesis-ai-requirements-api-ns

# Standard EMIS-X cloud governance tags (chart key: emis_tags — mirrors the
# genesis-hello-world reference).
# TODO: confirm the cost-allocation tags (aide, project_code, owner, team)
# with the owning team — these currently inherit the genesis-platform values.
emis_tags:
  repo: genesis-ai-requirements-api
  application: genesis-ai-requirements-api
  aide: aide_0091384
  business_unit: primary-care
  cost_centre: emis-x
  environment: non-prod
  hosting_location: aws.442042551704
  lifecycle: production
  owner: group.emisx-platform-engineering
  portfolio: "442042551704"
  product: emis-x
  programme_name: emis-x-gp
  project_code: prj0012275
  project_name: genesis-platform
  service: genesis-ai-requirements-api
  service_location: england
  service_tier: p1
  team: group.emisx-platform-engineering
  value_stream: nhs-integrated-care

serviceAccount:
  create: "true"

# Container listens on 8080 (ASPNETCORE default in the container image).
service:
  port: 8080

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# /healthz        — liveness (no dependency checks; confirms the process is up)
# /healthz/ready  — readiness (AllowAnonymous; checks PostgreSQL connectivity)
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  # The readiness check opens an IAM-authenticated Aurora connection. A cold
  # connect (IAM token + SSL + validation) can take ~2-3s, so the default 1s
  # probe timeout flaps the pod on an otherwise-healthy DB. 5s tolerates a cold
  # connect; failureThreshold still gates a genuine outage.
  timeoutSeconds: 5

networkPolicy:
  create: true

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: arm64

# Prefer cheaper Karpenter spot capacity (mirrors the reference).
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
          - spot

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# NOTE: application `env` is intentionally NOT set here.
#
# Argo CD / Helm REPLACE list values across valueFiles (lists are not merged),
# so the full `env` list is declared once, in each environment overlay
# (gitops/overlays/<env>/values.yaml). The API authenticates to RDS, S3 and
# Bedrock entirely via the EKS Pod Identity role provisioned by the
# ApplicationStack — there is no DB password, so no ExternalSecret is required.
