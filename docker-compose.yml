services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genesis_ai_requirements
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/backups/genesis_ai_requirements_20260605_081258.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: centraluk.jfrog.io/glb-docker-vir/flyway/flyway:12.1.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/genesis_ai_requirements
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
      - FLYWAY_BASELINE_ON_MIGRATE=true
      - FLYWAY_BASELINE_VERSION=0
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql

  seed:
    image: pgvector/pgvector:pg17
    depends_on:
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./db/seeds:/seeds:ro
    environment:
      - SEED_FORCE_RESET=${SEED_FORCE_RESET:-false}
    entrypoint: ["sh", "-c", "for f in /seeds/*.sql; do [ -e \"$$f\" ] || { echo 'No seed files found in /seeds — skipping'; break; }; echo \"Applying seed: $$f\"; PGPASSWORD=postgres psql -h postgres -U postgres -d genesis_ai_requirements -c \"SET app.seed_force_reset='$$SEED_FORCE_RESET';\" -f \"$$f\"; done"]
    networks:
      default:

  localstack:
    image: centraluk.jfrog.io/glb-docker-vir/localstack/localstack@sha256:897716c497b45eaa1c86c65fe4bd21806b07c2d230655f34ccfda7f6767d6383
    environment:
      - SERVICES=s3
      - DEBUG=0
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - ./db/seed-artefacts:/etc/localstack/seed-artefacts:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://genesis-ai-artefacts/projects/ --recursive | grep -q manifest.md"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - JF_USER
        - JF_TOKEN
        - GIT_TOKEN
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=genesis_ai_requirements;Username=postgres;Password=postgres
      - Authentication__Authority=${IDENTITY_URL}/v2.0/
      - Authentication__Audience=${AUDIENCE}
      - S3__ArtefactBucketName=genesis-ai-artefacts
      - S3__ServiceUrl=http://localstack:4566
      - Cors__AllowedOrigins__0=http://localhost:8080
      - Cors__AllowedOrigins__1=http://localhost:5000
      - Cors__AllowedOrigins__2=https://app.dev.emishealthsolutions.com
      - Cors__AllowedOrigins__3=https://app.int.emishealthsolutions.com
      - Cors__AllowedOrigins__4=https://app.stg.emis-x.uk
      - Cors__AllowedOrigins__5=https://app.emis-x.uk
      - Cors__AllowedOrigins__6=https://host.sbx.emishealthsolutions.com
    depends_on:
      seed:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:

secrets:
  JF_USER:
    environment: JFROG_USER
  JF_TOKEN:
    environment: JFROG_TOKEN
  GIT_TOKEN:
    environment: GIT_TOKEN
